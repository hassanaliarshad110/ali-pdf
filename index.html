<style>
:root{
  --bg:#e9ecf2; --panel:#ffffff; --panel2:#f6f7fa; --ink:#1b2130; --mut:#6b7385; --line:#e1e5ec;
  --acc:#2f5bff; --acc2:#e8eeff; --danger:#e5484d; --ok:#15a362; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.08);
  --r:10px; --top:54px;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme=dark]{
  --bg:#14171e; --panel:#1d212b; --panel2:#252a36; --ink:#e7eaf0; --mut:#9aa3b5; --line:#2e3442; --acc:#6d8bff; --acc2:#27304d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;flex-direction:column;height:100%}
/* top bar */
#top{height:var(--top);display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:15px;white-space:nowrap}
.logo{width:30px;height:30px;display:block;flex:none}
#fname{border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 8px;min-width:60px;max-width:260px;font-weight:500;font-size:13.5px;color:var(--mut)}
#fname:hover,#fname:focus{border-color:var(--line);background:var(--panel2);outline:none;color:var(--ink)}
.grow{flex:1}
.ib{width:36px;height:36px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.ib:hover{background:var(--panel2)} .ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib.on{background:var(--acc2);color:var(--acc)}
.btn{height:36px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.search{display:flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 4px 0 10px;height:36px}
.search input{border:0;background:transparent;outline:none;width:170px;font-size:13.5px}
.search .cnt{font-size:12px;color:var(--mut);min-width:34px;text-align:right}
.search .ib{width:28px;height:28px}
/* toolbar */
#toolbar{display:flex;align-items:center;gap:2px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none;z-index:20}
#toolbar::-webkit-scrollbar{display:none}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:9px;padding:5px 8px;min-width:58px;cursor:pointer;font-size:11px;font-weight:500;color:var(--mut);flex:none}
.tb:hover{background:var(--panel2);color:var(--ink)}
.tb.on{background:var(--acc2);color:var(--acc)}
.tb .i{width:20px;height:20px}
.sep{width:1px;height:30px;background:var(--line);margin:0 4px;flex:none}
#props{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;min-height:44px;font-size:13px;scrollbar-width:thin;z-index:19}
#props:empty{display:none}
#props label{display:flex;align-items:center;gap:6px;color:var(--mut);white-space:nowrap}
#props select,#props input[type=number]{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0 6px}
#props input[type=number]{width:62px}
#props input[type=range]{width:90px;accent-color:var(--acc)}
.sw{display:flex;gap:5px;align-items:center}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:none}
.sw button.on{box-shadow:0 0 0 2px var(--acc)}
.sw input[type=color]{width:26px;height:26px;border:0;background:none;padding:0;cursor:pointer}
.tg{height:30px;min-width:30px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;font-weight:700}
.tg.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.hint{color:var(--mut);white-space:nowrap}
/* main */
#main{flex:1;display:flex;min-height:0;position:relative}
#side{width:228px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;z-index:15}
#side.hide{display:none}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--acc2);color:var(--acc)}
.pane{flex:1;overflow:auto;min-height:0}
.pane[hidden]{display:none}
.pops{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.pops .ib{width:32px;height:32px}
.pops .selinfo{width:100%;font-size:11.5px;color:var(--mut);padding:2px 4px;display:flex;justify-content:space-between}
.pops .selinfo a{color:var(--acc);cursor:pointer}
#thumbs{padding:10px 0 30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.th{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:8px;padding:6px}
.th .box{position:relative;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.08);border-radius:3px;overflow:hidden}
.th canvas,.th svg{position:absolute;left:0;top:0;width:100%;height:100%}
.th .n{font-size:11.5px;color:var(--mut);font-weight:600}
.th.cur .box{box-shadow:0 0 0 2px var(--acc)}
.th.sel{background:var(--acc2)}
.th .ck{position:absolute;top:10px;left:10px;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.92);border:1.5px solid #b8c0cf;display:grid;place-items:center;z-index:2;opacity:0;transition:.15s}
.th:hover .ck,.th.sel .ck,#side.multi .th .ck{opacity:1}
.th.sel .ck{background:var(--acc);border-color:var(--acc)}
.th.sel .ck::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.th.dropB::before,.th.dropA::after{content:"";position:absolute;left:8px;right:8px;height:3px;background:var(--acc);border-radius:2px}
.th.dropB::before{top:-9px}.th.dropA::after{bottom:-9px}
.mut{color:var(--mut);font-size:12.5px;padding:14px}
.ol{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;font-size:12.5px;cursor:pointer;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol:hover{background:var(--panel2)}
.frm{padding:10px;display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px}
.fld>span{color:var(--mut);font-weight:600;word-break:break-all}
.fld input[type=text],.fld textarea,.fld select,.inp{border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:var(--panel2);width:100%;font-size:13px}
.fld textarea{resize:vertical;min-height:60px}
/* viewer */
#viewer{flex:1;overflow:auto;position:relative;min-width:0;-webkit-overflow-scrolling:touch}
#pages{display:flex;flex-direction:column;align-items:center;padding:22px 16px 90px;gap:18px;min-width:min-content;transform-origin:0 0}
.pg{position:relative;background:#fff;box-shadow:var(--shadow);flex:none}
.pg canvas.pgc{position:absolute;left:0;top:0;width:100%;height:100%}
.pg svg{position:absolute;left:0;top:0;overflow:visible}
.pg svg.hl{mix-blend-mode:multiply;pointer-events:none}
.pg svg.ov{touch-action:none}
body.t-select .pg svg.ov:not(.grab){touch-action:pan-x pan-y pinch-zoom}
.pg .num{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
body.t-text .pg svg.ov,body.t-note .pg svg.ov{cursor:text}
body.t-edittext .pg svg.ov{cursor:text}
body.t-highlight .pg svg.ov,body.t-pen .pg svg.ov,body.t-rect .pg svg.ov,body.t-ellipse .pg svg.ov,body.t-line .pg svg.ov,body.t-arrow .pg svg.ov,body.t-whiteout .pg svg.ov,body.t-redact .pg svg.ov,body.t-crop .pg svg.ov,body.placing .pg svg.ov{cursor:crosshair}
body.t-eraser .pg svg.ov{cursor:not-allowed}
.hit{fill:#ff9800;fill-opacity:.32}
.hit.cur{fill:#ff5722;fill-opacity:.5}
.tbox{fill:#2f5bff;fill-opacity:.06;stroke:#2f5bff;stroke-opacity:.55;stroke-width:1;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
.selr{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:5 3}
.selh{fill:#fff;stroke:var(--acc);stroke-width:2}
.cropPrev{fill:rgba(47,91,255,.08);stroke:#2f5bff;stroke-width:1.5;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.prevOutline{stroke:#888;stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
textarea.ed{position:absolute;z-index:5;border:1.5px dashed var(--acc);background:rgba(255,255,255,.85);outline:none;resize:none;overflow:hidden;white-space:pre;padding:0;margin:0;line-height:1.2;transform-origin:0 0;min-width:30px}
#empty{position:absolute;inset:0;display:grid;place-items:center;padding:20px;overflow:auto}
#empty[hidden]{display:none}
.drop{max-width:620px;width:100%;background:var(--panel);border:2px dashed var(--line);border-radius:18px;padding:34px 26px;text-align:center;box-shadow:var(--shadow)}
.drop.over{border-color:var(--acc);background:var(--acc2)}
.drop h1{font-size:24px;margin:10px 0 6px;letter-spacing:-.02em}
.drop p{color:var(--mut);margin:0 0 20px;font-size:14px}
.drop .big{height:48px;font-size:15px;padding:0 22px;border-radius:12px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:22px}
.qcard{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.qcard:hover{border-color:var(--acc);color:var(--acc)}
.qcard .i{width:22px;height:22px}
.feat{margin-top:18px;font-size:12px;color:var(--mut);line-height:1.7}
/* pill */
#pill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:var(--shadow);z-index:12;font-size:13px}
#pill[hidden]{display:none}
#pill .ib{width:32px;height:32px;border-radius:50%}
#zl{min-width:48px;text-align:center;font-weight:600;cursor:pointer;border:0;background:none;padding:4px}
#pgIn{width:38px;text-align:center;border:1px solid var(--line);border-radius:7px;background:var(--panel2);height:28px}
/* AI */
#ai{width:370px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex:none;z-index:16}
#ai[hidden]{display:none}
.aihd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
#aiMsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;max-width:92%;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}
.msg.b ul{margin:4px 0;padding-left:18px}
.msg .mact{margin-top:6px;display:flex;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--acc);color:var(--acc)}
#aiForm{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
#aiIn{flex:1;resize:none;height:42px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);font-size:13.5px}
/* modal */
.mb{position:fixed;inset:0;background:rgba(10,14,24,.45);display:grid;place-items:center;z-index:100;padding:14px;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.md{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(520px,100%);max-height:calc(100vh - 28px);display:flex;flex-direction:column;animation:pi .18s}
.md.wide{width:min(880px,100%)}
@keyframes pi{from{transform:translateY(8px) scale(.98)}}
.mh{display:flex;align-items:center;padding:14px 16px 10px;font-weight:700;font-size:16px;gap:8px}
.mbdy{padding:4px 16px 14px;overflow:auto;font-size:13.5px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.row>label{display:flex;align-items:center;gap:6px}
.lbl{font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 4px;display:block}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc2)}
.opt input{margin-top:3px;accent-color:var(--acc)}
.opt small{display:block;color:var(--mut);margin-top:2px}
/* tools grid */
.tcat{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 8px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px;cursor:pointer;text-align:left;font-size:13px;font-weight:600}
.tcard:hover{border-color:var(--acc);background:var(--acc2)}
.tcard .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.tcard small{display:block;font-weight:400;color:var(--mut);font-size:11.5px;margin-top:1px}
/* signature */
.sigcv{width:100%;height:190px;border:1px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;display:block}
.fontpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fontpick button{height:64px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#111;font-size:28px;cursor:pointer;overflow:hidden;white-space:nowrap}
.fontpick button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.saved div{position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;height:80px;display:grid;place-items:center;cursor:pointer}
.saved img{max-width:90%;max-height:70px}
.saved b{position:absolute;top:4px;right:6px;color:#999;font-size:16px;cursor:pointer}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stamps button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;cursor:pointer;height:70px;display:grid;place-items:center}
.stamps img{max-width:100%;max-height:52px}
/* toast/busy */
#toasts{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:#1d2333;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fi .2s;max-width:88vw;text-align:center}
.toast.err{background:#b4232c}.toast.ok{background:#127a4c}
#busy{position:fixed;inset:0;background:rgba(10,14,24,.35);display:none;place-items:center;z-index:150}
#busy.on{display:grid}
#busy .card{background:var(--panel);padding:20px 26px;border-radius:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);font-weight:600;font-size:14px}
.spin{width:24px;height:24px;border:3px solid var(--acc2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.only-m{display:none}
@media (max-width:860px){
  .hide-m{display:none!important}
  .only-m{display:inline-flex}
  #side{position:absolute;left:0;top:0;bottom:0;box-shadow:var(--shadow);width:220px}
  #ai{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:420px;box-shadow:var(--shadow)}
  .search input{width:110px}
  #fname{max-width:130px}
  .tb{min-width:52px;padding:5px 6px}
  #top{gap:2px;padding:0 6px}
  .btn span.lab{display:none}
  .btn{padding:0 10px}
}
@media (max-width:520px){ .brand span{display:none} #searchWrap:not(.open){display:none} }

async function handleFiles(files, mode) {
  files = [...files]; if (!files.length) return;
  const pdfs = files.filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  const imgs = files.filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(f.name));
  const other = files.length - pdfs.length - imgs.length;
  if (other) toast(`${other} file(s) skipped — only PDFs and images can be opened here. For Word/Excel, save them as PDF first.`, '', 4500);
  if (!pdfs.length && !imgs.length) return;
  if (!mode) {
    if (S.pages.length) {
      mode = await new Promise(res => {
        let done = false;
        modal({ title: 'Open files', body: el('div', {}, 'You already have a document open. What would you like to do?'), onClose: () => { if (!done) res(null); },
          actions: [{ label: 'Cancel', onClick: () => { done = true; res(null); } }, { label: 'Open as new', onClick: () => { done = true; res('new'); } }, { label: 'Merge into current', primary: true, onClick: () => { done = true; res('append'); } }] });
      });
      if (!mode) return;
    } else mode = 'new';
  }
  const wasEmpty = !S.pages.length || mode === 'new';
  if (mode === 'new' && S.pages.length) { if (S.dirty && !(await confirmBox('Discard unsaved changes to the current document?', 'Discard', true))) return; await newDocument(); }
  let insertAt = mode === 'after' ? S.cur + 1 : S.pages.length;
  snapIf(!wasEmpty);
  busy('Opening…');
  const added = [];
  try {
    for (const f of pdfs) {
      busy('Opening ' + f.name + '…');
      try {
        const bytes = await readAB(f);
        const src = await addSource(bytes, f.name);
        const pg = pagesOf(src); added.push(...pg);
        if (wasEmpty && added.length === pg.length) {
          S.fileName = f.name.replace(/\.pdf$/i, '') + '.pdf';
          try { const md = await src.doc.getMetadata(); const inf = md?.info || {}; S.meta = { title: inf.Title || '', author: inf.Author || '', subject: inf.Subject || '', keywords: inf.Keywords || '' }; } catch { }
        }

    }
    if (imgs.length) {

      const src = await addSource(bytes, 'images.pdf');
      added.push(...pagesOf(src));
      if (wasEmpty && !pdfs.length) S.fileName = (imgs.length === 1 ? imgs[0].name.replace(/\.[^.]+$/, '') : 'images') + '.pdf';

  $('#fname').value = S.fileName;
  if (wasEmpty) { S.cur = 0; S.aiHist = []; }

}

async function imagesToPdf(files, { size = 'fit', margin = 0 } = {}) {
  const d = await PL.PDFDocument.create();
  for (const f of files) {
    let url = f.url || await readURL(f);
    let img;
    if (/^data:image\/png/.test(url)) img = await d.embedPng(dataUrlToBytes(url));
    else if (/^data:image\/jpe?g/.test(url)) img = await d.embedJpg(dataUrlToBytes(url));
    else { const im = await loadImg(url); const c = el('canvas'); c.width = im.naturalWidth || 1000; c.height = im.naturalHeight || 1000; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); img = await d.embedPng(dataUrlToBytes(c.toDataURL('image/png'))); }

    let W, H;
    if (size === 'fit') { W = iw + margin * 2; H = ih + margin * 2; }
    else { const base = size === 'letter' ? [612, 792] : [595.28, 841.89]; [W, H] = iw > ih ? [base[1], base[0]] : base; }

function trimCanvas(c) {
  const x = c.getContext('2d'), d = x.getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let k = 0; k < c.width; k++) if (d[(y * c.width + k) * 4 + 3] > 8) { if (k < x0) x0 = k; if (k > x1) x1 = k; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null; const pad = 6; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width - 1, x1 + pad); y1 = Math.min(c.height - 1, y1 + pad);
  const o = el('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1; o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height); return o;

function toolsDialog() {
  const body = el('div'); const fns = [];
  for (const [cat, col, items] of TCATS) {
    body.append(el('div', { class: 'tcat' }, cat));
    const g = el('div', { class: 'tgrid' });
    for (const [i, t, d, fn] of items) { const k = fns.push(fn) - 1; g.append(el('button', { class: 'tcard', 'data-k': k, html: `<div class="ic" style="background:${col}">${ic(i)}</div><div>${t}<small>${d}</small></div>` })); }
    body.append(g);
  }
  const m = modal({ title: 'All tools', body, wide: true });
  body.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; const fn = fns[+b.dataset.k]; m.close(); const needs = !/Merge|Images to PDF|Ask AI/.test(b.textContent); if (needs && !S.pages.length) { toast('Open a PDF first'); return; } fn(); });
}

/* ============================== wiring ============================== */
const setIc = (id, n) => { const b = $(id); b.insertAdjacentHTML('afterbegin', ic(n)); };
setIc('#bSide', 'sidebar'); setIc('#qPrev', 'up'); setIc('#qNext', 'down'); setIc('#bSearchM', 'search'); setIc('#bUndo', 'undo'); setIc('#bRedo', 'redo'); setIc('#bOpen', 'open'); setIc('#bTools', 'grid'); setIc('#bAI', 'ai'); setIc('#bSave', 'save'); setIc('#bTheme', 'moon');
setIc('#zOut', 'zout'); setIc('#zIn', 'zin'); setIc('#zFit', 'fit'); setIc('#pPrev', 'prev'); setIc('#pNext', 'next'); setIc('#aiClose', 'x'); $('#aiIc').innerHTML = ic('ai');
$('#bSide').onclick = () => toggleSide(); $('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bOpen').onclick = () => $('#fOpen').click(); $('#bTools').onclick = toolsDialog;
$('#bAI').onclick = () => toggleAI(); $('#aiClose').onclick = () => toggleAI(false); $('#bSave').onclick = savePdf;
$('#bTheme').onclick = () => { const d = document.documentElement.dataset.theme === 'dark'; document.documentElement.dataset.theme = d ? '' : 'dark'; LS.set('theme', d ? '' : 'dark'); };
if (LS.get('theme', '') === 'dark') document.documentElement.dataset.theme = 'dark';
$('#bSearchM').onclick = () => { const w = $('#searchWrap'); if (w.classList.contains('open')) { w.classList.remove('open'); w.classList.add('hide-m'); } else openSearch(); };
$('#qPrev').onclick = () => stepHit(-1); $('#qNext').onclick = () => stepHit(1);
$('#zIn').onclick = () => setZoom(S.zoom * 1.2); $('#zOut').onclick = () => setZoom(S.zoom / 1.2); $('#zl').onclick = () => fitWidth(); $('#zFit').onclick = fitPage;
$('#pPrev').onclick = () => gotoPage(S.cur - 1); $('#pNext').onclick = () => gotoPage(S.cur + 1);
$('#pgIn').addEventListener('change', e => gotoPage((parseInt(e.target.value) || 1) - 1));
$('#pgIn').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#fname').addEventListener('change', e => { S.fileName = (e.target.value.trim() || 'document').replace(/\.pdf$/i, '') + '.pdf'; e.target.value = S.fileName; });
$('#fOpen').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; handleFiles(f); });
$('[data-act=open]').onclick = () => $('#fOpen').click();
$('#quick').innerHTML = [['merge', 'Merge PDFs'], ['convert', 'Images to PDF'], ['sign', 'Sign a PDF'], ['blank', 'Blank PDF']].map(([i, t], k) => `<div class="qcard" data-q="${k}">${ic(i)}${t}</div>`).join('');
$('#quick').addEventListener('click', async e => {
  const q = e.target.closest('[data-q]'); if (!q) return;
  if (!window.__appReady) { toast('Still loading…'); return; }
  const k = +q.dataset.q;
  if (k === 0) { const f = await pickFiles('application/pdf,.pdf', true); if (f) handleFiles(f, 'new'); }
  else if (k === 1) imagesDialog();
  else if (k === 2) { const f = await pickFiles('application/pdf,.pdf'); if (f) { await handleFiles(f, 'new'); signDialog(); } }
  else { const src = await addSource(await blankPdf(), 'blank.pdf'); S.pages = pagesOf(src); S.fileName = 'untitled.pdf'; $('#fname').value = S.fileName; await refreshAll(); fitWidth(true); }
});
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (dragIds) return; if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); dragDepth++; $('#drop').classList.add('over'); } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('over'); } });
window.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => { if (dragIds) return; if (e.dataTransfer?.files?.length) { e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('over'); handleFiles(e.dataTransfer.files); } });
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
let rzT = 0; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (innerWidth <= 860) { } }, 200); });
if (innerWidth <= 860) toggleSide(false); else $('#bSide').classList.add('on');
renderProps(); updUndo();
window.__appReady = true; $('#loadMsg').innerHTML = 'Edit text · Highlight · Draw · Shapes · Sign · Stamps · Comments · Redact · Whiteout · Forms · Crop · Rotate · Reorder · Merge · Split · Extract · Watermark · Page numbers · Compress · PDF ↔ Word / Excel / JPG / PNG / Text · AI assistant';
window.__S = S;
if (DESKTOP) {
  setInterval(() => { fetch('/__ping').catch(() => { }); }, 5000);
  fetch('/__open').then(async r => { if (r.ok && r.status === 200) { const name = decodeURIComponent(r.headers.get('X-Name') || 'document.pdf'); const b = await r.blob(); if (b.size) handleFiles([new File([b], name, { type: 'application/pdf' })], 'new'); } }).catch(() => { });
}
